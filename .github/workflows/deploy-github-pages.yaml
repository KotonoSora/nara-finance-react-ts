name: Deploy to Cloudflare Pages with D1

on:
  push:
    branches:
      - gh-pages  # Runs only on gh-pages
      - feature/transactions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Replace Database ID in Wrangler Config
        run: |
          sed -i 's|your-database-name|'"$D1_DATABASE_NAME"'|g' wrangler.toml
          sed -i 's|your-database-id|'"$D1_DATABASE_ID"'|g' wrangler.toml
        shell: bash

      - name: Replace Database ID in Drizzle Config
        run: |
          sed -i 's|your-database-id|'"$D1_DATABASE_ID"'|g' drizzle.config.ts
        shell: bash

      - name: Run D1 Migrations
        run: bun run db:migrate-production

      - name: Deploy to Cloudflare Pages
        run: bun run deploy
